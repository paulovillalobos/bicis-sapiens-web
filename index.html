<!doctype html>
<html lang="pt">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="manifest" href="/manifest.json" />
    <title>Bicis Sapiens — O espaço público é de todos</title>
    <meta name="description" content="Movimento cívico para tornar as cidades 100% amigas da bicicleta, sem construir nova infraestrutura. Porto, Portugal." />

    <!-- Open Graph — for WhatsApp / LinkedIn / iMessage / Facebook / Slack previews.
         ⚠️ When bicisapiens.org goes live, swap og:url and the og/twitter image URLs
         from bicis-sapiens-web.vercel.app to bicisapiens.org. -->
    <meta property="og:site_name" content="Bicis Sapiens" />
    <meta property="og:title" content="Bicis Sapiens — O espaço público é de todos" />
    <meta property="og:description" content="Movimento cívico para tornar as cidades 100% amigas da bicicleta. Sem obras. Com pessoas. Porto, Portugal." />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://bicis-sapiens-web.vercel.app/" />
    <meta property="og:locale" content="pt_PT" />
    <meta property="og:locale:alternate" content="en_US" />
    <meta property="og:locale:alternate" content="es_ES" />
    <meta property="og:locale:alternate" content="fr_FR" />
    <meta property="og:image" content="https://bicis-sapiens-web.vercel.app/og-image.png" />
    <meta property="og:image:secure_url" content="https://bicis-sapiens-web.vercel.app/og-image.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="O espaço público é de todos. A cidade também. — Bicis Sapiens" />

    <!-- Twitter Card — needs its own tags; summary_large_image renders the full hero -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Bicis Sapiens — O espaço público é de todos" />
    <meta name="twitter:description" content="Movimento cívico para tornar as cidades 100% amigas da bicicleta. Sem obras. Com pessoas." />
    <meta name="twitter:image" content="https://bicis-sapiens-web.vercel.app/og-image.png" />
    <meta name="twitter:image:alt" content="O espaço público é de todos. A cidade também. — Bicis Sapiens" />

    <meta name="theme-color" content="#000000" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,900;1,900&family=Fraunces:opsz,wght@9..144,500;9..144,700;9..144,900&family=Inter:wght@400;500&family=JetBrains+Mono:wght@400;500&display=swap" />

    <!-- Hero LCP image: preload desktop + mobile via media-aware preload -->
    <link rel="preload" as="image" href="/images/hero-bridge.webp" media="(min-width: 769px)" fetchpriority="high" />
    <link rel="preload" as="image" href="/images/hero-bridge-mobile.webp" media="(max-width: 768px)" fetchpriority="high" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
